<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Weather</h1>
      <div class="units" role="group" aria-label="Units">
        <button type="button" data-unit="metric" aria-pressed="false">°C</button>
        <button type="button" data-unit="imperial" aria-pressed="false">°F</button>
      </div>
    </header>

    <form id="search-form" class="search">
      <input id="city" type="search" placeholder="Search for a city" autocomplete="off" required aria-label="City name">
      <button type="submit">Search</button>
      <button type="button" id="locate" class="icon-btn" title="Use my location" aria-label="Use my location">📍</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">Search for a city or use your location.</p>

    <section id="current" class="card current" hidden>
      <div class="place">
        <h2 id="place"></h2>
        <p id="updated" class="muted"></p>
      </div>
      <div class="now">
        <span id="icon" class="icon" aria-hidden="true"></span>
        <span id="temp" class="temp"></span>
      </div>
      <p id="condition" class="condition"></p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Precipitation</dt><dd id="precip"></dd></div>
      </dl>
    </section>

    <section id="daily" class="card" hidden>
      <h3>7-day forecast</h3>
      <ul id="daily-list" class="daily"></ul>
    </section>
  </main>

  <footer class="footer">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>, an open-source API that needs no key.
  </footer>

  <script src="app.js"></script>
</body>
</html>
